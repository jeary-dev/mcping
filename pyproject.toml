[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcping"
version = "0.1.0"
description = "Check the status of any Minecraft Java server - CLI and async Python library."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jeary-dev" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcping = "mcping.__main__:main"

[tool.setuptools]
packages = ["mcping"]

[tool.pytest.ini_options]
testpaths = ["tests"]